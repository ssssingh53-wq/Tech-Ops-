<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EM – Issue Tracker &amp; SLA Report v2.2</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141417; --line:#26262b;
    --txt:#f3f3f5; --muted:#9a9aa3; --accent:#f2c811;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px; border-bottom:1px solid var(--line);
    background:var(--panel); flex:0 0 auto; gap:12px;
  }
  header .title{font-size:14px; font-weight:600; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header .title span{color:var(--accent)}
  .counter{font-size:13px; color:var(--muted); white-space:nowrap}

  .stage{
    flex:1 1 auto; position:relative; display:flex; align-items:center; justify-content:center;
    padding:14px; min-height:0;
  }
  .slide-wrap{
    position:relative; max-width:100%; max-height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  img.slide{
    max-width:100%; max-height:100%; object-fit:contain;
    border:1px solid var(--line); border-radius:6px;
    pointer-events:none; -webkit-user-drag:none; user-drag:none;
    box-shadow:0 8px 40px rgba(0,0,0,.6);
  }
  /* transparent shield over the image to defeat long-press / drag-save */
  .shield{position:absolute; inset:0; z-index:2}

  .nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:46px; height:46px; border-radius:50%;
    background:rgba(20,20,23,.8); border:1px solid var(--line);
    color:var(--txt); font-size:22px; cursor:pointer; z-index:5;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .nav:hover{background:var(--accent); color:#000; border-color:var(--accent)}
  .nav:disabled{opacity:.25; cursor:default; background:rgba(20,20,23,.8); color:var(--txt)}
  .nav.prev{left:18px} .nav.next{right:18px}

  footer{
    flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:8px; padding:8px 12px; overflow-x:auto;
  }
  .thumb{
    flex:0 0 auto; width:112px; height:63px; border-radius:4px;
    border:2px solid transparent; overflow:hidden; cursor:pointer; opacity:.55;
    background:#000; position:relative;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; pointer-events:none; -webkit-user-drag:none}
  .thumb.active{opacity:1; border-color:var(--accent)}
  .thumb .n{
    position:absolute; bottom:2px; right:4px; font-size:10px; color:#fff;
    background:rgba(0,0,0,.6); padding:0 4px; border-radius:3px;
  }
  .hint{font-size:11px; color:var(--muted); text-align:center; padding:4px}
  @media (max-width:640px){ .thumb{width:84px;height:47px} .nav{width:38px;height:38px} }
</style>
</head>
<body oncontextmenu="return false">
  <header>
    <div class="title">EM – Issue Tracker &amp; SLA Report <span>v2.2</span></div>
    <div class="counter"><span id="cur">1</span> / <span id="total">10</span></div>
  </header>

  <div class="stage">
    <button class="nav prev" id="prev" aria-label="Previous">&#8249;</button>
    <div class="slide-wrap">
      <img class="slide" id="slide" alt="slide">
      <div class="shield"></div>
    </div>
    <button class="nav next" id="next" aria-label="Next">&#8250;</button>
  </div>

  <footer id="thumbs"></footer>
  <div class="hint">Use ← → arrow keys or click a thumbnail. Press F for fullscreen.</div>

<script>
  const COUNT = 10;
  const pad = n => String(n).padStart(2,'0');
  const src = i => `slides/slide-${pad(i)}.png`;
  let idx = 1;

  const slide = document.getElementById('slide');
  const cur   = document.getElementById('cur');
  const prev  = document.getElementById('prev');
  const next  = document.getElementById('next');
  const thumbs= document.getElementById('thumbs');
  document.getElementById('total').textContent = COUNT;

  // build thumbnails
  for(let i=1;i<=COUNT;i++){
    const t = document.createElement('div');
    t.className='thumb'; t.dataset.i=i;
    t.innerHTML = `<img src="${src(i)}" loading="lazy" alt=""><span class="n">${i}</span>`;
    t.addEventListener('click',()=>go(i));
    thumbs.appendChild(t);
  }
  const thumbEls = [...thumbs.children];

  function go(i){
    idx = Math.max(1, Math.min(COUNT, i));
    slide.src = src(idx);
    cur.textContent = idx;
    prev.disabled = idx===1;
    next.disabled = idx===COUNT;
    thumbEls.forEach((e,k)=>e.classList.toggle('active',k===idx-1));
    const act = thumbEls[idx-1];
    if(act) act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  }

  prev.addEventListener('click',()=>go(idx-1));
  next.addEventListener('click',()=>go(idx+1));
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='PageDown') go(idx+1);
    else if(e.key==='ArrowLeft'||e.key==='PageUp') go(idx-1);
    else if(e.key==='Home') go(1);
    else if(e.key==='End') go(COUNT);
    else if(e.key==='f'||e.key==='F'){
      if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  });
  // block drag-save
  document.addEventListener('dragstart',e=>e.preventDefault());

  go(1);
</script>
</body>
</html>
